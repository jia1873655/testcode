activity_record:
  path_prefix: /customer_activity_record
  success_codes: [0, 200]
  expected_http_status: 200
  create:
    path: /customer_activity_record/create
    # customer_id / source 以 conf [activity_record] 为准
    source: 2
    content_prefix: "autotest-activity"
    tags:
      - 自动化
      - 待回访
    response_fields:
      - id
      - create_time
      - create_user
  update:
    path: /customer_activity_record/update
    content_suffix: "-updated"
    tags:
      - 重点
    response_fields:
      - id
      - update_time
      - update_user
  delete:
    path: /customer_activity_record/delete
    response_fields:
      - id
  list:
    path: /customer_activity_record/list
    page: 1
    page_size: 20
    response_fields:
      - list
      - total
      - page
      - page_size
    list_item_field_types:
      id: int
      customer_id: str
      source: int
      content: str
      tags: list
      create_time: str
      create_user: int
      create_user_name: str
  get_by_id:
    path: /customer_activity_record/get_by_id
    response_fields:
      - id
      - customer_id
      - source
      - content
      - tags
      - create_time
      - create_user
    not_found_id: 999999999
  missing_customer_id:
    source: 2
    content: "缺少客户id应失败"
