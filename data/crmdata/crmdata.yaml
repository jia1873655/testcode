  method: GET
  valid:
    # 与 config [customer] id 一致时以配置为准；此处作为数据文件兜底
    id: 1516
    expected_http_status: 200
    success_codes: [0, 200]
    expected:
      id: 1516
    required_fields:
      - id
      - referrer_commission_basis
      - referrer_commission_rate
      - referrer_customer_id
    field_types:
      assignment_time: str
      attachments: list
      business_status: int
      cannot_cooperate_reason: int
      cannot_cooperate_remark: str
      contact_number: str
      create_time: str
      customer_brand_website: str
      customer_name: str
      email: str
      erp_id: str
      estimated_level: str
      follow_up_business_group_id: int
      follow_up_sales_person_id: int
      has_referrer: int
      id: int
      intended_product: str
      is_customization_required: int
      lead_source: int
      lead_source_level2: int
      merchant_id: str
      order_system: int
      ownership_status: int
      product_link: str
      referrer: str
      referrer_code: str
      referrer_remark: str
      remark: str
      shop_name: str
      social_media_account: str
      target_country: str
      update_time: str
      referrer_commission_basis: int
      referrer_commission_rate: str
      referrer_customer_id: str
    attachment_item_fields:
      - content_type
      - file_size
      - id
      - is_image
      - original_filename
    attachment_item_types:
      content_type: str
      file_size: int
      id: int
      is_image: int
      original_filename: str
  not_found:
    id: 999999999
    expected_http_status: [400, 404, 500]
  missing_id:
    expected_http_status: [400, 500]
  invalid_ids:
    - id: 0
      title: "客户详情 - id 为 0"
      expected_http_status: [400, 500]
    - id: -1
      title: "客户详情 - id 为负数"
      expected_http_status: [400, 500]
    - id: abc
      title: "客户详情 - id 为非数字"
      expected_http_status: [400, 500]

