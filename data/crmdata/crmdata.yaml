duplicate_check:
  path: /customer/duplicate_check
  method: POST
  success_codes: [0, 200]
  expected_http_status: 200
  response_fields:
    - is_duplicated
  field_types:
    is_duplicated: bool
  # check_type: 1 联系号码，2 邮箱
  empty_value:
    check_type: 1
    value: ""
    expected_is_duplicated: false
  unique_phone:
    check_type: 1
    value: "19900001111"
    expected_is_duplicated: false
  unique_email:
    check_type: 2
    value: "__autotest_no_such_email_xyz@example.com"
    expected_is_duplicated: false
  # 正例：从 get_by_id 提取已有联系方式后断言 is_duplicated=true
  from_existing_customer:
    check_type_phone: 1
    check_type_email: 2

